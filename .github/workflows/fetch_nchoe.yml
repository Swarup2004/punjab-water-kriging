name: Fetch N-CHOE River

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Show repo layout (debug)
        run: |
          pwd
          ls -lah
          ls -lah data || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install osmnx geopandas shapely folium numpy

      - name: Run script (root)
        run: |
          python fetch_nchoe_osm.py

      - name: Commit outputs in data/
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update N-CHOE line & samples (data/)"
          file_pattern: |
            data/nchoe_river_line.geojson
            data/nchoe_river_samples.geojson
            data/nchoe_river_map.html
