name: Fetch N-CHOE River

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Show repo layout (debug)
        run: |
          pwd
          ls -lah
          ls -lah data || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          # Pin versions that play nicely together on ubuntu-latest
          pip install "osmnx>=2.0.0,<2.2" "geopandas>=0.14" "shapely>=2.0" folium numpy
          # If you have a requirements.txt, install it after pins so it won't downgrade core libs
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run script (root)
        run: |
          python fetch_nchoe_osm.py

      - name: Commit outputs in data/
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update N-CHOE line & samples (data/)"
          file_pattern: |
            data/nchoe_river_line.geojson
            data/nchoe_river_samples.geojson
            data/nchoe_river_map.html
