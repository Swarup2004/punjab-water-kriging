name: Fetch N-CHOE River

on:
  workflow_dispatch: {}   # lets you manually run it

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          pip install osmnx geopandas shapely folium numpy

      - name: Run your script
        run: |
          python fetch_nchoe_osm.py

      - name: Commit GeoJSON outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update river line + sample points from OSM"
          file_pattern: |
            *.geojson
            *.html
