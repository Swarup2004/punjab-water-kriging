name: Fetch N-CHOE River

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Show repo layout (debug)
        run: |
          pwd
          ls -lah
          ls -lah data || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          pip install "osmnx>=2.0.0,<2.2" "geopandas>=0.14" "shapely>=2.0" folium numpy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -c "import osmnx, shapely, geopandas; print('OSMnx', osmnx.__version__, 'Shapely', shapely.__version__, 'GeoPandas', geopandas.__version__)"

      - name: Run script
        run: python fetch_nchoe_osm.py

      - name: Commit outputs in data/
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update N-CHOE line & samples (data/)"
          file_pattern: |
            data/nchoe_river_line.geojson
            data/nchoe_river_samples.geojson
            data/nchoe_river_map.html
